<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <title>Offline Installer</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin-top: 20%;
    }
    #progressBar {
      width: 80%;
      height: 20px;
      background: #333;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      width: 0%;
      background: lime;
      transition: width 0.3s ease-in-out;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🚀 نصب کش آفلاین</h1>
<button onclick="startCaching()">شروع نصب</button>

<div id="progressBar"><div id="progressFill"></div></div>
<p id="status">آماده نصب</p>

<script>
function startCaching() {
  document.getElementById('status').innerText = "در حال نصب کش...";
  window.applicationCache.addEventListener("progress", function(e) {
    if (e.lengthComputable) {
      var percent = Math.round(e.loaded / e.total * 100);
      document.getElementById('progressFill').style.width = percent + "%";
      document.getElementById('status').innerText = "در حال نصب کش... " + percent + "%";
    }
  }, false);

  window.applicationCache.addEventListener("cached", function() {
    document.getElementById('status').innerText = "✅ نصب کامل شد! انتقال به صفحه اصلی...";
    setTimeout(function() {
      window.location.href = "main.html";
    }, 1500);
  }, false);

  window.applicationCache.addEventListener("error", function() {
    document.getElementById('status').innerText = "❌ خطا در نصب کش. لطفاً دوباره تلاش کنید.";
  }, false);
}
</script>

</body>
</html>
